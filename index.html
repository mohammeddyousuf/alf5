<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALFragrance</title>
    <meta name="description" content="Premium fragrances and perfumes. Discover your signature scent at ALFragrance." />
    <meta name="author" content="ALFragrance" />
    
    <!-- Facebook Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://alfragrance.com" />
    <meta property="og:title" content="ALFragrance - Premium Fragrances" />
    <meta property="og:description" content="Premium fragrances and perfumes. Discover your signature scent at ALFragrance." />
    <meta property="og:site_name" content="ALFragrance" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ALFragrance - Premium Fragrances" />
    <meta name="twitter:description" content="Premium fragrances and perfumes. Discover your signature scent at ALFragrance." />
    
    <!-- Pinterest Domain Verification -->
    <meta name="p:domain_verify" content="9a924cb4412342db5239420f39ebce1e"/>
    
    <link rel="icon" id="favicon" href="/favicon.ico" />
  </head>

  <body>
    <div id="root"></div>
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Update favicon and title when needed
      async function updateFaviconAndTitle() {
        try {
          const response = await fetch('https://hoytbffldsdeywkyuuza.supabase.co/rest/v1/settings?select=favicon_url,website_name&order=created_at.desc&limit=1', {
            headers: {
              'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhveXRiZmZsZHNkZXl3a3l1dXphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzM3MTAyNDksImV4cCI6MjA0OTI4NjI0OX0.gJwvzpKqdhIWhsIGF1a4BPUXysKXNtB-lg_aNG_VFz4',
              'Content-Type': 'application/json'
            }
          });
          
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          
          const data = await response.json();
          if (data && data.length > 0) {
            // Update favicon if available
            if (data[0].favicon_url) {
              const faviconLink = document.getElementById('favicon');
              const timestamp = new Date().getTime();
              faviconLink.href = `${data[0].favicon_url}?t=${timestamp}`;
              console.log('Favicon updated:', data[0].favicon_url);
            }
            
            // Update website title if available
            if (data[0].website_name) {
              document.title = data[0].website_name;
              console.log('Title updated:', data[0].website_name);
            }
          }
        } catch (error) {
          console.error('Error updating favicon and title:', error);
        }
      }
      
      // Initial update
      updateFaviconAndTitle();
      
      // Listen for custom event when settings are updated
      window.addEventListener('settingsUpdated', updateFaviconAndTitle);
    </script>
  </body>
</html>
