  <body>
    <div id="root"></div>
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Update favicon dynamically
      async function updateFavicon() {
        try {
          const response = await fetch('https://hoytbffldsdeywkyuuza.supabase.co/rest/v1/settings?select=favicon_url', {
            headers: {
              'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhveXRiZmZsZHNkZXl3a3l1dXphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzM3MTAyNDksImV4cCI6MjA0OTI4NjI0OX0.gJwvzpKqdhIWhsIGF1a4BPUXysKXNtB-lg_aNG_VFz4',
              'Content-Type': 'application/json'
            }
          });
          
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          
          const data = await response.json();
          if (data[0]?.favicon_url) {
            const faviconLink = document.getElementById('favicon');
            // Force browser to reload favicon by appending timestamp
            faviconLink.href = `${data[0].favicon_url}?t=${new Date().getTime()}`;
          }
        } catch (error) {
          console.error('Error updating favicon:', error);
        }
      }
      
      // Initial update
      updateFavicon();
      
      // Update favicon every 5 seconds
      setInterval(updateFavicon, 5000);
    </script>
  </body>
